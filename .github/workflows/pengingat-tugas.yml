# Kirim email pengingat tugas (deadline ≤ 24 jam) — memanggil API tiap jam.
# Butuh GitHub Secrets: API_URL (mis. https://api.kuliahpintar.id) dan CRON_SECRET (sama dengan env di Railway).
name: Pengingat Tugas

on:
  schedule:
    - cron: '7 * * * *' # tiap jam, menit ke-7 (hindari antrean menit 0)
  workflow_dispatch: {}

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil endpoint pengingat
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets API_URL / CRON_SECRET belum di-set — lewati."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/api/v1/cron/pengingat-tugas"
